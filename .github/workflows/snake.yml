name: Generate snake animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF6B1A&color_dots=#1A1033,#4C2A85,#A78BFA,#FCD34D,#FF6B1A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF6B1A&color_dots=#161B22,#3B2470,#A78BFA,#FCD34D,#FF6B1A
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
