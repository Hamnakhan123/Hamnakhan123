name: Generate snake animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF4FA3&color_dots=#2A0B3D,#6B2A7A,#B794F6,#FF9CCF,#FF4FA3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4FA3&color_dots=#161B22,#4A1D5C,#7E3A9A,#B794F6,#FF4FA3
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
