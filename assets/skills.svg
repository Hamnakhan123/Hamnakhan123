<text class="in" x="70" y="58" font-size="13" font-weight="700" letter-spacing="4" fill="#FF5FA2" text-anchor="start">EXPERTISE</text><text class="in" x="70" y="92" font-size="28" font-weight="800" fill="#fff" text-anchor="start" style="animation-delay:.12s">Skills I bring to every project</text><g class="in" style="animation-delay:0.30s"><text x="70" y="140" font-size="17" font-weight="700" fill="#fff">Web Design &amp; Development</text><text x="570" y="140" font-size="13" font-weight="700" text-anchor="end" fill="#FF5FA2">Expert</text><rect x="70" y="154" width="500" height="12" rx="6" fill="#2A2347"/><rect class="bar0" x="70" y="154" width="475" height="12" rx="6" fill="#FF5FA2"/><rect class="shine0" x="70" y="154" width="60" height="12" rx="6" fill="#fff" opacity=".0"/></g><g class="in" style="animation-delay:0.45s"><text x="630" y="140" font-size="17" font-weight="700" fill="#fff">Data Structures</text><text x="1130" y="140" font-size="13" font-weight="700" text-anchor="end" fill="#C084FC">Expert</text><rect x="630" y="154" width="500" height="12" rx="6" fill="#2A2347"/><rect class="bar1" x="630" y="154" width="460" height="12" rx="6" fill="#C084FC"/><rect class="shine1" x="630" y="154" width="60" height="12" rx="6" fill="#fff" opacity=".0"/></g><g class="in" style="animation-delay:0.60s"><text x="70" y="218" font-size="17" font-weight="700" fill="#fff">Software Engineering &amp; SDLC</text><text x="570" y="218" font-size="13" font-weight="700" text-anchor="end" fill="#5EEAD4">Advanced</text><rect x="70" y="232" width="500" height="12" rx="6" fill="#2A2347"/><rect class="bar2" x="70" y="232" width="450" height="12" rx="6" fill="#5EEAD4"/><rect class="shine2" x="70" y="232" width="60" height="12" rx="6" fill="#fff" opacity=".0"/></g><g class="in" style="animation-delay:0.75s"><text x="630" y="218" font-size="17" font-weight="700" fill="#fff">Git &amp; GitHub</text><text x="1130" y="218" font-size="13" font-weight="700" text-anchor="end" fill="#7DD3FC">Advanced</text><rect x="630" y="232" width="500" height="12" rx="6" fill="#2A2347"/><rect class="bar3" x="630" y="232" width="450" height="12" rx="6" fill="#7DD3FC"/><rect class="shine3" x="630" y="232" width="60" height="12" rx="6" fill="#fff" opacity=".0"/></g><g class="in" style="animation-delay:0.90s"><text x="70" y="296" font-size="17" font-weight="700" fill="#fff">Jira &amp; Agile / Scrum</text><text x="570" y="296" font-size="13" font-weight="700" text-anchor="end" fill="#FBBF24">Advanced</text><rect x="70" y="310" width="500" height="12" rx="6" fill="#2A2347"/><rect class="bar4" x="70" y="310" width="425" height="12" rx="6" fill="#FBBF24"/><rect class="shine4" x="70" y="310" width="60" height="12" rx="6" fill="#fff" opacity=".0"/></g><g class="in" style="animation-delay:1.05s"><text x="630" y="296" font-size="17" font-weight="700" fill="#fff">Event Management</text><text x="1130" y="296" font-size="13" font-weight="700" text-anchor="end" fill="#FF5FA2">Expert</text><rect x="630" y="310" width="500" height="12" rx="6" fill="#2A2347"/><rect class="bar5" x="630" y="310" width="475" height="12" rx="6" fill="#FF5FA2"/><rect class="shine5" x="630" y="310" width="60" height="12" rx="6" fill="#fff" opacity=".0"/></g>
