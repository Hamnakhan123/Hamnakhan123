.dr3{animation:dr3 16s ease-in-out infinite} @keyframes dr3{50%{transform:translate(40px,-40px)}}
.bar0{transform-box:fill-box;transform-origin:left;animation:gr 1.6s 0.50s cubic-bezier(.2,.8,.2,1) both}.shine0{animation:sn0 3s 2.10s ease-in-out infinite}@keyframes sn0{0%{opacity:0;transform:translateX(0)}20%{opacity:.35}60%{opacity:0;transform:translateX(415px)}100%{opacity:0}}.bar1{transform-box:fill-box;transform-origin:left;animation:gr 1.6s 0.65s cubic-bezier(.2,.8,.2,1) both}.shine1{animation:sn1 3s 2.25s ease-in-out infinite}@keyframes sn1{0%{opacity:0;transform:translateX(0)}20%{opacity:.35}60%{opacity:0;transform:translateX(400px)}100%{opacity:0}}.bar2{transform-box:fill-box;transform-origin:left;animation:gr 1.6s 0.80s cubic-bezier(.2,.8,.2,1) both}.shine2{animation:sn2 3s 2.40s ease-in-out infinite}@keyframes sn2{0%{opacity:0;transform:translateX(0)}20%{opacity:.35}60%{opacity:0;transform:translateX(390px)}100%{opacity:0}}.bar3{transform-box:fill-box;transform-origin:left;animation:gr 1.6s 0.95s cubic-bezier(.2,.8,.2,1) both}.shine3{animation:sn3 3s 2.55s ease-in-out infinite}@keyframes sn3{0%{opacity:0;transform:translateX(0)}20%{opacity:.35}60%{opacity:0;transform:translateX(390px)}100%{opacity:0}}.bar4{transform-box:fill-box;transform-origin:left;animation:gr 1.6s 1.10s cubic-bezier(.2,.8,.2,1) both}.shine4{animation:sn4 3s 2.70s ease-in-out infinite}@keyframes sn4{0%{opacity:0;transform:translateX(0)}20%{opacity:.35}60%{opacity:0;transform:translateX(365px)}100%{opacity:0}}.bar5{transform-box:fill-box;transform-origin:left;animation:gr 1.6s 1.25s cubic-bezier(.2,.8,.2,1) both}.shine5{animation:sn5 3s 2.85s ease-in-out infinite}@keyframes sn5{0%{opacity:0;transform:translateX(0)}20%{opacity:.35}60%{opacity:0;transform:translateX(415px)}100%{opacity:0}}@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style></defs>
