<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF5FA2"/><stop offset=".5" stop-color="#C084FC"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
<linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#FF5FA2"/><stop offset=".33" stop-color="#C084FC"/><stop offset=".66" stop-color="#5EEAD4"/><stop offset="1" stop-color="#FF5FA2"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#FF5FA2" stop-opacity=".35"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#C084FC" stop-opacity=".35"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
<radialGradient id="b3"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".25"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
<style>
text{font-family:'Segoe UI','Poppins',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.in{animation:in .9s cubic-bezier(.2,.8,.2,1) both} @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both} @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite} @keyframes fl{50%{transform:translateY(-8px)}}
.pu{animation:pu 2.4s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.dr1{animation:dr1 14s ease-in-out infinite} @keyframes dr1{50%{transform:translate(60px,30px)}}
.dr2{animation:dr2 18s ease-in-out infinite} @keyframes dr2{50%{transform:translate(-70px,-20px)}}
.dr3{animation:dr3 16s ease-in-out infinite} @keyframes dr3{50%{transform:translate(40px,-40px)}}
.draw{animation:dw 2.6s .3s ease forwards}@keyframes dw{to{stroke-dashoffset:0}}
</style></defs>
<rect width="1200" height="370" rx="20" fill="#0D0B1A"/>
<g class="dr1"><circle cx="180.0" cy="74.0" r="259.0" fill="url(#b1)"/></g>
<g class="dr2"><circle cx="1020.0" cy="111.0" r="277.5" fill="url(#b2)"/></g>
<g class="dr3"><circle cx="600.0" cy="388.5" r="222.0" fill="url(#b3)"/></g>
<text class="in" x="70" y="58" font-size="13" font-weight="700" letter-spacing="4" fill="#FF5FA2" text-anchor="start">MY JOURNEY</text><text class="in" x="70" y="92" font-size="28" font-weight="800" fill="#fff" text-anchor="start" style="animation-delay:.12s">From student to software engineer &amp; educator</text><line x1="150" y1="235" x2="1050" y2="235" stroke="#2A2347" stroke-width="6" stroke-linecap="round"/><line class="draw" x1="150" y1="235" x2="1050" y2="235" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/><circle r="7" fill="#fff" class="runner"><animateMotion dur="6s" repeatCount="indefinite" path="M150 235 H1050"/></circle><g class="pop" style="animation-delay:0.40s"><circle cx="150" cy="235" r="20" fill="#0D0B1A" stroke="#FF5FA2" stroke-width="4"/><circle cx="150" cy="235" r="8" fill="#FF5FA2" class="pu" style="animation-delay:0.0s"/></g><g class="in" style="animation-delay:0.55s"><text x="150" y="189" font-size="19" font-weight="800" text-anchor="middle" fill="#fff">JUW</text><text x="150" y="165" font-size="14" text-anchor="middle" fill="#FF5FA2">BS Software Engineering</text><text x="150" y="145" font-size="12" letter-spacing="1" text-anchor="middle" fill="#9A92BF">GRADUATED</text></g><g class="pop" style="animation-delay:0.75s"><circle cx="375" cy="235" r="20" fill="#0D0B1A" stroke="#C084FC" stroke-width="4"/><circle cx="375" cy="235" r="8" fill="#C084FC" class="pu" style="animation-delay:0.3s"/></g><g class="in" style="animation-delay:0.90s"><text x="375" y="291" font-size="19" font-weight="800" text-anchor="middle" fill="#fff">10Pearls</text><text x="375" y="313" font-size="14" text-anchor="middle" fill="#C084FC">SHINE MERN Intern</text><text x="375" y="333" font-size="12" letter-spacing="1" text-anchor="middle" fill="#9A92BF">2025</text></g><g class="pop" style="animation-delay:1.10s"><circle cx="600" cy="235" r="20" fill="#0D0B1A" stroke="#FBBF24" stroke-width="4"/><circle cx="600" cy="235" r="8" fill="#FBBF24" class="pu" style="animation-delay:0.6s"/></g><g class="in" style="animation-delay:1.25s"><text x="600" y="189" font-size="19" font-weight="800" text-anchor="middle" fill="#fff">Aptech</text><text x="600" y="165" font-size="14" text-anchor="middle" fill="#FBBF24">Faculty Member</text><text x="600" y="145" font-size="12" letter-spacing="1" text-anchor="middle" fill="#9A92BF">WEB &amp; PROGRAMMING</text></g><g class="pop" style="animation-delay:1.45s"><circle cx="825" cy="235" r="20" fill="#0D0B1A" stroke="#5EEAD4" stroke-width="4"/><circle cx="825" cy="235" r="8" fill="#5EEAD4" class="pu" style="animation-delay:0.9s"/></g><g class="in" style="animation-delay:1.60s"><text x="825" y="291" font-size="19" font-weight="800" text-anchor="middle" fill="#fff">IoBM</text><text x="825" y="313" font-size="14" text-anchor="middle" fill="#5EEAD4">Junior Lecturer</text><text x="825" y="333" font-size="12" letter-spacing="1" text-anchor="middle" fill="#9A92BF">2026 → NOW</text></g><g class="pop" style="animation-delay:1.80s"><circle cx="1050" cy="235" r="20" fill="#0D0B1A" stroke="#7DD3FC" stroke-width="4"/><circle cx="1050" cy="235" r="8" fill="#7DD3FC" class="pu" style="animation-delay:1.2s"/></g><g class="in" style="animation-delay:1.95s"><text x="1050" y="189" font-size="19" font-weight="800" text-anchor="middle" fill="#fff">NED University</text><text x="1050" y="165" font-size="14" text-anchor="middle" fill="#7DD3FC">Master's</text><text x="1050" y="145" font-size="12" letter-spacing="1" text-anchor="middle" fill="#9A92BF">IN PROGRESS</text></g>
<rect x=".75" y=".75" width="1198.5" height="368.5" rx="19.5" fill="none" stroke="url(#g)" stroke-opacity=".5" stroke-width="1.5"/>
</svg>