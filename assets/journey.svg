.pu{animation:pu 2.6s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.tw{animation:tw 3s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1700px)}}
.draw{stroke-dasharray:960;animation:dr 3s ease both}@keyframes dr{from{stroke-dashoffset:960}to{stroke-dashoffset:0}}
