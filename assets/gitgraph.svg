.fl{animation:fl 4s ease-in-out infinite} @keyframes fl{50%{transform:translateY(-6px)}}
.mainl{stroke-dasharray:1080;animation:dm 2s ease both}@keyframes dm{from{stroke-dashoffset:1080}to{stroke-dashoffset:0}}
