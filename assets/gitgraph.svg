.in{animation:in .8s ease both} @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both} @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
