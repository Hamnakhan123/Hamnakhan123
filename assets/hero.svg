<text class="r0" x="70" y="262" font-size="34" font-weight="800" fill="#FF5FA2">Software Engineer</text><text class="r1" x="70" y="262" font-size="34" font-weight="800" fill="#C084FC">Lecturer @ IoBM</text><text class="r2" x="70" y="262" font-size="34" font-weight="800" fill="#5EEAD4">Web Developer</text><text class="r3" x="70" y="262" font-size="34" font-weight="800" fill="#FBBF24">Event Organizer</text>
