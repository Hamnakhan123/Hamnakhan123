ay:2.9s;animation-duration:3.9s"/><circle cx="527" cy="121" r="1.2" fill="#fff" class="pu" style="animation-delay:1.4s;animation-duration:4.0s"/><circle cx="385" cy="167" r="1.6" fill="#5EEAD4" class="pu" style="animation-delay:0.5s;animation-duration:2.9s"/><circle cx="808" cy="158" r="1.8" fill="#FF5FA2" class="pu" style="animation-delay:3.0s;animation-duration:3.2s"/><circle cx="1128" cy="28" r="1.3" fill="#5EEAD4" class="pu" style="animation-delay:2.5s;animation-duration:3.2s"/><circle cx="391" cy="162" r="1.2" fill="#5EEAD4" class="pu" style="animation-delay:1.5s;animation-duration:2.6s"/><circle cx="458" cy="321" r="0.8" fill="#C084FC" class="pu" style="animation-delay:2.3s;animation-duration:2.6s"/><circle cx="278" cy="333" r="1.1" fill="#fff" class="pu" style="animation-delay:0.7s;animation-duration:3.3s"/><circle cx="133" cy="254" r="2.1" fill="#C084FC" class="pu" style="animation-delay:2.7s;animation-duration:2.9s"/>
