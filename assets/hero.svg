.dr2{animation:dr2 18s ease-in-out infinite} @keyframes dr2{50%{transform:translate(-70px,-20px)}}
.dr3{animation:dr3 16s ease-in-out infinite} @keyframes dr3{50%{transform:translate(40px,-40px)}}
.r0{opacity:0;animation:r0 12s infinite}@keyframes r0{0%,0.0%{opacity:0;transform:translateY(16px)}2.0%,23.0%{opacity:1;transform:none}25.0%,100%{opacity:0;transform:translateY(-16px)}}.r1{opacity:0;animation:r1 12s infinite}@keyframes r1{0%,25.0%{opacity:0;transform:translateY(16px)}27.0%,48.0%{opacity:1;transform:none}50.0%,100%{opacity:0;transform:translateY(-16px)}}.r2{opacity:0;animation:r2 12s infinite}@keyframes r2{0%,50.0%{opacity:0;transform:translateY(16px)}52.0%,73.0%{opacity:1;transform:none}75.0%,100%{opacity:0;transform:translateY(-16px)}}.r3{opacity:0;animation:r3 12s infinite}@keyframes r3{0%,75.0%{opacity:0;transform:translateY(16px)}77.0%,98.0%{opacity:1;transform:none}100.0%,100%{opacity:0;transform:translateY(-16px)}}.spin{transform-origin:930px 215px;animation:sp 10s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 2s ease-out infinite}@keyframes rg{from{transform:scale(1);opacity:1}to{transform:scale(3);opacity:0}}
</style><linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#FF6B1A" stop-opacity="0"/><stop offset=".7" stop-color="#FF6B1A" stop-opacity=".8"/><stop offset="1" stop-color="#FCD34D"/></linearGradient>
