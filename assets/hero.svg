<text class="in" x="66" y="190" font-size="66" font-weight="900" fill="url(#gs)" style="animation-delay:.15s">Hamna Zahid Khan</text>
<text class="r0" x="70" y="262" font-size="34" font-weight="800" fill="#FF6B1A">Software Engineer</text><text class="r1" x="70" y="262" font-size="34" font-weight="800" fill="#A78BFA">Lecturer @ IoBM</text><text class="r2" x="70" y="262" font-size="34" font-weight="800" fill="#FCD34D">Web Developer</text><text class="r3" x="70" y="262" font-size="34" font-weight="800" fill="#F43F5E">Event Organizer</text>
<text class="in" x="70" y="316" font-size="18" fill="#F5EEFF" style="animation-delay:.4s">I design and build modern websites, teach Data Structures &amp; Software</text>
<text class="in" x="70" y="342" font-size="18" fill="#F5EEFF" style="animation-delay:.5s">Engineering at IoBM, and organize events people remember.</text>
