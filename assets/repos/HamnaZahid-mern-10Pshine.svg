<text class="t" x="507.5" y="48" font-size="12" font-weight="800" text-anchor="middle" fill="#F9C97C">INTERNSHIP</text>
<text class="t s in d1" x="30" y="98" font-size="15">Built during the 10Pearls SHINE</text><text class="t s in d1" x="30" y="120" font-size="15">internship, end to end.</text><g class="in d2"><rect x="30" y="148" width="80" height="28" rx="14" fill="#fff" fill-opacity=".07" stroke="#F9C97C" stroke-opacity=".35"/><text class="t" x="70.0" y="167" font-size="13" font-weight="600" text-anchor="middle">MongoDB</text></g><g class="in d3"><rect x="118" y="148" width="80" height="28" rx="14" fill="#fff" fill-opacity=".07" stroke="#F9C97C" stroke-opacity=".35"/><text class="t" x="158.0" y="167" font-size="13" font-weight="600" text-anchor="middle">Express</text></g><g class="in d4"><rect x="206" y="148" width="64" height="28" rx="14" fill="#fff" fill-opacity=".07" stroke="#F9C97C" stroke-opacity=".35"/><text class="t" x="238.0" y="167" font-size="13" font-weight="600" text-anchor="middle">React</text></g><g class="in d5"><rect x="278" y="148" width="56" height="28" rx="14" fill="#fff" fill-opacity=".07" stroke="#F9C97C" stroke-opacity=".35"/><text class="t" x="306.0" y="167" font-size="13" font-weight="600" text-anchor="middle">Node</text></g><g class="sh"><rect x="0" y="0" width="60" height="200" fill="#fff" fill-opacity=".04" transform="skewX(-20)"/></g></svg>