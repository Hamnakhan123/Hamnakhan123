<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14061F"/><stop offset=".55" stop-color="#2A0B3D"/><stop offset="1" stop-color="#170A30"/></linearGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#FF4FA3"/><stop offset=".5" stop-color="#B794F6"/><stop offset="1" stop-color="#F9C97C"/></linearGradient>
<linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FF9CCF"/><stop offset=".5" stop-color="#B794F6"/><stop offset=".65" stop-color="#F9C97C"/><stop offset="1" stop-color="#FFFFFF"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="glowA" cx=".85" cy=".3" r=".5"><stop offset="0" stop-color="#FF4FA3" stop-opacity=".35"/><stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".1" cy=".95" r=".5"><stop offset="0" stop-color="#B794F6" stop-opacity=".28"/><stop offset="1" stop-color="#B794F6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".07"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
<style>
.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
.m{fill:#E9D8FD} .s{fill:#C4B5D9}
.in{animation:fi 1.1s ease both}
.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}.d5{animation-delay:1.15s}.d6{animation-delay:1.4s}.d7{animation-delay:1.65s}.d8{animation-delay:1.9s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite} .fl2{animation:fl 6.5s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translateY(-7px)}}
.pu{animation:pu 2.6s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.tw{animation:tw 3s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1700px)}}

</style></defs><rect width="600" height="200" rx="22" fill="url(#bg)"/><rect width="600" height="200" rx="22" fill="url(#dots)"/><rect width="600" height="200" rx="22" fill="url(#glowA)"/><rect width="600" height="200" rx="22" fill="url(#glowB)"/><rect x="1" y="1" width="598" height="198" rx="21" fill="none" stroke="url(#acc)" stroke-opacity=".55" stroke-width="1.5"/><rect x="12" y="24" width="4" height="152" rx="2" fill="#F9C97C"/>
