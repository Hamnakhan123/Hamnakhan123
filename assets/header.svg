<style>
.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
.m{fill:#E9D8FD} .s{fill:#C4B5D9}
.in{animation:fi 1.1s ease both}
.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}.d5{animation-delay:1.15s}.d6{animation-delay:1.4s}.d7{animation-delay:1.65s}.d8{animation-delay:1.9s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite} .fl2{animation:fl 6.5s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translateY(-7px)}}
.pu{animation:pu 2.6s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.tw{animation:tw 3s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1700px)}}
.r0{opacity:0;animation:rl 15s linear infinite;animation-delay:0s}.r1{opacity:0;animation:rl 15s linear infinite;animation-delay:3s}.r2{opacity:0;animation:rl 15s linear infinite;animation-delay:6s}.r3{opacity:0;animation:rl 15s linear infinite;animation-delay:9s}.r4{opacity:0;animation:rl 15s linear infinite;animation-delay:12s}@keyframes rl{0%{opacity:0;transform:translateY(10px)}2.40%{opacity:1;transform:none}17.00%{opacity:1;transform:none}20.00%,100%{opacity:0;transform:translateY(-10px)}}.r0{opacity:1}.orb{transform-origin:960px 200px;animation:rot 30s linear infinite}.orb2{transform-origin:960px 200px;animation:rot 20s linear infinite reverse}@keyframes rot{to{transform:rotate(360deg)}}.cur{animation:pu 1s steps(1) infinite}
</style></defs><rect width="1200" height="400" rx="22" fill="url(#bg)"/><rect width="1200" height="400" rx="22" fill="url(#dots)"/><rect width="1200" height="400" rx="22" fill="url(#glowA)"/><rect width="1200" height="400" rx="22" fill="url(#glowB)"/><rect x="1" y="1" width="1198" height="398" rx="21" fill="none" stroke="url(#acc)" stroke-opacity=".55" stroke-width="1.5"/>
