olving</text><rect x="808" y="207" width="304" height="3" rx="1.5" fill="#FCD34D" class="pu" style="animation-delay:0.8s"/></g><g class="pop" style="animation-delay:0.61s"><rect x="70" y="228" width="340" height="92" rx="16" fill="#150F2A" stroke="#2E2150"/><rect x="88" y="250" width="48" height="48" rx="14" fill="#60A5FA" fill-opacity=".15"/><text x="112" y="282" font-size="22" font-weight="900" text-anchor="middle" fill="#60A5FA">04</text><text x="154" y="270" font-size="17" font-weight="800" fill="#fff">Web Development</text><text x="154" y="294" font-size="13.5" fill="#A99BC9">HTML · CSS · JS · React</text><rect x="88" y="317" width="304" height="3" rx="1.5" fill="#60A5FA" class="pu" style="animation-delay:1.2s"/></g><g class="pop" style="animation-delay:0.73s"><rect x="430" y="228" width="340" height="92" rx="16" fill="#150F2A" stroke="#2E2150"/><rect x="448" y="250" width="48" height="48" rx="14" fill="#F43F5E" fill-opacity=".15"/><text x="472" y="282" font-size="22" font-weight="900" text-anchor="middle" fill="#F43F5E">05</text><text x="514" y="270" font-size="17" font-weight="800" fill="#fff">Git &amp; Version Control</text><text x="514" y="294" font-size="13.5" fill="#A99BC9">Branches · PRs · Teamwork</text><rect x="448" y="317" width="304" height="3" rx="1.5" fill="#F43F5E" class="pu" style="animation-delay:1.6s"/></g><g class="pop" style="animation-delay:0.85s"><rect x="790" y="228" width="340" height="92" rx="16" fill="#150F2A" stroke="#2E2150"/><rect x="808" y="250" width="48" height="48" rx="14" fill="#FF6B1A" fill-opacity=".15"/><text x="832" y="282" font-size="22" font-weight="900" text-anchor="middle" fill="#FF6B1A">06</text><text x="874" y="270" font-size="17" font-weight="800" fill="#fff">ICT</text><text x="874" y="294" font-size="13.5" fill="#A99BC9">Computing Essentials</text><rect x="808" y="317" width="304" height="3" rx="1.5" fill="#FF6B1A" class="pu" style="animation-delay:2.0s"/></g>
