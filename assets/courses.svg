<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF6B1A"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FCD34D"/></linearGradient>
<linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#FF6B1A"/><stop offset=".33" stop-color="#A78BFA"/><stop offset=".66" stop-color="#FCD34D"/><stop offset="1" stop-color="#FF6B1A"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#FF6B1A" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<radialGradient id="b3"><stop offset="0" stop-color="#FCD34D" stop-opacity=".25"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
<style>
text{font-family:'Segoe UI','Poppins',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.in{animation:in .9s cubic-bezier(.2,.8,.2,1) both} @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both} @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite} @keyframes fl{50%{transform:translateY(-8px)}}
.pu{animation:pu 2.4s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.dr1{animation:dr1 14s ease-in-out infinite} @keyframes dr1{50%{transform:translate(60px,30px)}}
.dr2{animation:dr2 18s ease-in-out infinite} @keyframes dr2{50%{transform:translate(-70px,-20px)}}
.dr3{animation:dr3 16s ease-in-out infinite} @keyframes dr3{50%{transform:translate(40px,-40px)}}

</style></defs>
<rect width="1200" height="340" rx="20" fill="#0A0716"/>
<g class="dr1"><circle cx="180.0" cy="68.0" r="237.99999999999997" fill="url(#b1)"/></g>
<g class="dr2"><circle cx="1020.0" cy="102.0" r="255.0" fill="url(#b2)"/></g>
<g class="dr3"><circle cx="600.0" cy="357.0" r="204.0" fill="url(#b3)"/></g>
