<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14061F"/><stop offset=".55" stop-color="#2A0B3D"/><stop offset="1" stop-color="#170A30"/></linearGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#FF4FA3"/><stop offset=".5" stop-color="#B794F6"/><stop offset="1" stop-color="#F9C97C"/></linearGradient>
<linearGradient id="shim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FF9CCF"/><stop offset=".5" stop-color="#B794F6"/><stop offset=".65" stop-color="#F9C97C"/><stop offset="1" stop-color="#FFFFFF"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="glowA" cx=".85" cy=".3" r=".5"><stop offset="0" stop-color="#FF4FA3" stop-opacity=".35"/><stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".1" cy=".95" r=".5"><stop offset="0" stop-color="#B794F6" stop-opacity=".28"/><stop offset="1" stop-color="#B794F6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".07"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
<style>
.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff}
.m{fill:#E9D8FD} .s{fill:#C4B5D9}
.in{animation:fi 1.1s ease both}
.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.d4{animation-delay:.9s}.d5{animation-delay:1.15s}.d6{animation-delay:1.4s}.d7{animation-delay:1.65s}.d8{animation-delay:1.9s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite} .fl2{animation:fl 6.5s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translateY(-7px)}}
.pu{animation:pu 2.6s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.tw{animation:tw 3s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.sh{animation:sh 6s ease-in-out infinite} @keyframes sh{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1700px)}}

</style></defs><rect width="1200" height="180" rx="22" fill="url(#bg)"/><rect width="1200" height="180" rx="22" fill="url(#dots)"/><rect width="1200" height="180" rx="22" fill="url(#glowA)"/><rect width="1200" height="180" rx="22" fill="url(#glowB)"/><rect x="1" y="1" width="1198" height="178" rx="21" fill="none" stroke="url(#acc)" stroke-opacity=".55" stroke-width="1.5"/><g class="in d1"><g class="fl" style="animation-delay:0.0s"><rect x="30" y="28" width="270" height="124" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#FF4FA3" stroke-opacity=".55"/>
<rect x="30" y="28" width="6" height="124" rx="3" fill="#FF4FA3"/>
<text class="t" x="165" y="92" font-size="40" font-weight="800" text-anchor="middle" fill="#FF4FA3">IoBM</text>
<text class="t s" x="165" y="124" font-size="16" font-weight="600" text-anchor="middle">Junior Lecturer</text></g></g><g class="in d2"><g class="fl" style="animation-delay:0.6s"><rect x="320" y="28" width="270" height="124" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#B794F6" stroke-opacity=".55"/>
<rect x="320" y="28" width="6" height="124" rx="3" fill="#B794F6"/>
<text class="t" x="455" y="92" font-size="40" font-weight="800" text-anchor="middle" fill="#B794F6">NED</text>
<text class="t s" x="455" y="124" font-size="16" font-weight="600" text-anchor="middle">Master's, in progress</text></g></g><g class="in d3"><g class="fl" style="animation-delay:1.2s"><rect x="610" y="28" width="270" height="124" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#F9C97C" stroke-opacity=".55"/>
<rect x="610" y="28" width="6" height="124" rx="3" fill="#F9C97C"/>
<text class="t" x="745" y="92" font-size="40" font-weight="800" text-anchor="middle" fill="#F9C97C">6+</text>
<text class="t s" x="745" y="124" font-size="16" font-weight="600" text-anchor="middle">Courses I teach</text></g></g><g class="in d4"><g class="fl" style="animation-delay:1.7999999999999998s"><rect x="900" y="28" width="270" height="124" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#5EEAD4" stroke-opacity=".55"/>
<rect x="900" y="28" width="6" height="124" rx="3" fill="#5EEAD4"/>
<text class="t" x="1035" y="92" font-size="40" font-weight="800" text-anchor="middle" fill="#5EEAD4">Expert</text>
<text class="t s" x="1035" y="124" font-size="16" font-weight="600" text-anchor="middle">Web Design &amp; Events</text></g></g></svg>