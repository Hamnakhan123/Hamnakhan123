.blink{animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.fl{animation:fl 4s ease-in-out infinite} @keyframes fl{50%{transform:translateY(-6px)}}
.cv0{animation:cv0 0.50s steps(10) both;animation-delay:0.30s}@keyframes cv0{from{transform:translateX(0)}to{transform:translateX(116.0px)}}.cv1{animation:cv1 0.50s steps(17) both;animation-delay:0.66s}@keyframes cv1{from{transform:translateX(0)}to{transform:translateX(173.6px)}}.cv2{animation:cv2 0.50s steps(18) both;animation-delay:1.11s}@keyframes cv2{from{transform:translateX(0)}to{transform:translateX(183.2px)}}.cv3{animation:cv3 0.50s steps(39) both;animation-delay:1.54s}@keyframes cv3{from{transform:translateX(0)}to{transform:translateX(375.2px)}}.cv4{animation:cv4 0.50s steps(19) both;animation-delay:1.99s}@keyframes cv4{from{transform:translateX(0)}to{transform:translateX(192.79999999999998px)}}.cv5{animation:cv5 0.50s steps(38) both;animation-delay:2.43s}@keyframes cv5{from{transform:translateX(0)}to{transform:translateX(365.59999999999997px)}}.cv6{animation:cv6 0.50s steps(29) both;animation-delay:2.88s}@keyframes cv6{from{transform:translateX(0)}to{transform:translateX(288.8px)}}.cv7{animation:cv7 0.50s steps(44) both;animation-delay:3.43s}@keyframes cv7{from{transform:translateX(0)}to{transform:translateX(423.2px)}}.cv8{animation:cv8 0.50s steps(26) both;animation-delay:3.88s}@keyframes cv8{from{transform:translateX(0)}to{transform:translateX(260.0px)}}.cv9{animation:cv9 0.50s steps(29) both;animation-delay:4.40s}@keyframes cv9{from{transform:translateX(0)}to{transform:translateX(288.8px)}}.spin{transform-origin:975px 250px;animation:sp 26s linear infinite}.spin2{transform-origin:975px 250px;animation:sp 14s linear infinite reverse}@keyframes sp{to{transform:rotate(360deg)}}
</style></defs>
