<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF5FA2"/><stop offset=".5" stop-color="#C084FC"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
<linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#FF5FA2"/><stop offset=".33" stop-color="#C084FC"/><stop offset=".66" stop-color="#5EEAD4"/><stop offset="1" stop-color="#FF5FA2"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="glow" cx=".8" cy=".2" r=".6"><stop offset="0" stop-color="#C084FC" stop-opacity=".18"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx=".1" cy="1" r=".6"><stop offset="0" stop-color="#FF5FA2" stop-opacity=".14"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C084FC"/></marker>
<style>
.mo{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace} .sa{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.in{animation:in .8s ease both} @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both} @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.pu{animation:pu 2.2s ease-in-out infinite} @keyframes pu{50%{opacity:.3}}
.blink{animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.fl{animation:fl 4s ease-in-out infinite} @keyframes fl{50%{transform:translateY(-6px)}}
.p0{animation:push .7s cubic-bezier(.3,1.3,.5,1) both;animation-delay:0.30s}.p1{animation:push .7s cubic-bezier(.3,1.3,.5,1) both;animation-delay:0.65s}.p2{animation:push .7s cubic-bezier(.3,1.3,.5,1) both;animation-delay:1.00s}.p3{animation:push .7s cubic-bezier(.3,1.3,.5,1) both;animation-delay:1.35s}.p4{animation:push .7s cubic-bezier(.3,1.3,.5,1) both;animation-delay:1.70s}.p5{animation:push .7s cubic-bezier(.3,1.3,.5,1) both;animation-delay:2.05s}@keyframes push{from{opacity:0;transform:translateY(-120px)}to{opacity:1;transform:none}}
</style></defs>
<rect width="1200" height="420" rx="18" fill="#0D0B1A"/><rect width="1200" height="420" rx="18" fill="url(#grid)"/><rect width="1200" height="420" rx="18" fill="url(#glow)"/><rect width="1200" height="420" rx="18" fill="url(#glow2)"/>
<text class="mo in" x="40" y="50" font-size="14" fill="#8B83B0">const skills = new Stack&lt;Skill&gt;();</text><text class="sa in" x="40" y="82" font-size="26" font-weight="800" fill="#fff" style="animation-delay:.15s">Skills Stack</text><path d="M46 130 L46 394 L404 394 L404 130" fill="none" stroke="#8B83B0" stroke-width="2"/><g class="p0"><rect x="60" y="344" width="330" height="40" rx="9" fill="#7DD3FC" fill-opacity=".16" stroke="#7DD3FC" stroke-width="1.5"/><text class="sa" x="225.0" y="370" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Git · Jira · Agile</text><text class="mo" x="72" y="369" font-size="11" fill="#7DD3FC">5</text></g><g class="p1"><rect x="60" y="300" width="330" height="40" rx="9" fill="#FBBF24" fill-opacity=".16" stroke="#FBBF24" stroke-width="1.5"/><text class="sa" x="225.0" y="326" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">MERN Stack</text><text class="mo" x="72" y="325" font-size="11" fill="#FBBF24">4</text></g><g class="p2"><rect x="60" y="256" width="330" height="40" rx="9" fill="#C084FC" fill-opacity=".16" stroke="#C084FC" stroke-width="1.5"/><text class="sa" x="225.0" y="282" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">React · Tailwind</text><text class="mo" x="72" y="281" font-size="11" fill="#C084FC">3</text></g><g class="p3"><rect x="60" y="212" width="330" height="40" rx="9" fill="#5EEAD4" fill-opacity=".16" stroke="#5EEAD4" stroke-width="1.5"/><text class="sa" x="225.0" y="238" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Data Structures</text><text class="mo" x="72" y="237" font-size="11" fill="#5EEAD4">2</text></g><g class="p4"><rect x="60" y="168" width="330" height="40" rx="9" fill="#FF5FA2" fill-opacity=".16" stroke="#FF5FA2" stroke-width="1.5"/><text class="sa" x="225.0" y="194" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Web Design &amp; UI/UX</text><text class="mo" x="72" y="193" font-size="11" fill="#FF5FA2">1</text></g><g class="p5"><rect x="60" y="124" width="330" height="40" rx="9" fill="#FBBF24" fill-opacity=".16" stroke="#FBBF24" stroke-width="1.5"/><text class="sa" x="225.0" y="150" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Event Management</text><text class="mo" x="72" y="149" font-size="11" fill="#FBBF24">0</text></g><g class="pu"><text class="mo" x="416" y="150" font-size="14" fill="#FF5FA2">← top()</text></g><text class="mo" x="416" y="176" font-size="12" fill="#8B83B0">LIFO: last pushed,</text><text class="mo" x="416" y="194" font-size="12" fill="#8B83B0">first shown ✦</text><text class="mo in" x="640" y="50" font-size="14" fill="#8B83B0">const work = new Queue&lt;Project&gt;();</text><text class="sa in" x="640" y="82" font-size="26" font-weight="800" fill="#fff">How I Work With Clients</text><text class="mo" x="640" y="176" font-size="12.5" fill="#8B83B0">enqueue(idea) →</text><text class="mo" x="1160" y="176" font-size="12.5" text-anchor="end" fill="#8B83B0">→ dequeue()</text><rect x="640" y="194" width="520" height="92" rx="14" fill="none" stroke="#2A2347" stroke-width="1.5" stroke-dasharray="6 6"/><g class="pop" style="animation-delay:0.40s"><rect x="654" y="210" width="104" height="60" rx="11" fill="#15112A" stroke="#FF5FA2" stroke-width="1.6"/><text class="mo" x="706.0" y="234" font-size="11" text-anchor="middle" fill="#FF5FA2">[0]</text><text class="sa" x="706.0" y="255" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">Design</text></g><g class="pop" style="animation-delay:0.70s"><rect x="780" y="210" width="104" height="60" rx="11" fill="#15112A" stroke="#C084FC" stroke-width="1.6"/><text class="mo" x="832.0" y="234" font-size="11" text-anchor="middle" fill="#C084FC">[1]</text><text class="sa" x="832.0" y="255" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">Develop</text></g><g class="pop" style="animation-delay:1.00s"><rect x="906" y="210" width="104" height="60" rx="11" fill="#15112A" stroke="#FBBF24" stroke-width="1.6"/><text class="mo" x="958.0" y="234" font-size="11" text-anchor="middle" fill="#FBBF24">[2]</text><text class="sa" x="958.0" y="255" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">Test</text></g><g class="pop" style="animation-delay:1.30s"><rect x="1032" y="210" width="104" height="60" rx="11" fill="#15112A" stroke="#5EEAD4" stroke-width="1.6"/><text class="mo" x="1084.0" y="234" font-size="11" text-anchor="middle" fill="#5EEAD4">[3]</text><text class="sa" x="1084.0" y="255" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">Deliver</text></g><circle r="7" fill="#FF5FA2"><animateMotion dur="4s" repeatCount="indefinite" path="M630 240 L1170 240"/><animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/></circle><g class="in" style="animation-delay:1.60s"><text class="sa" x="640" y="330" font-size="16" fill="#5EEAD4" font-weight="800">✔</text><text class="sa" x="664" y="330" font-size="16" fill="#E9E4FF">Pixel-perfect, responsive UI</text></g><g class="in" style="animation-delay:1.80s"><text class="sa" x="640" y="360" font-size="16" fill="#5EEAD4" font-weight="800">✔</text><text class="sa" x="664" y="360" font-size="16" fill="#E9E4FF">Clean code, tracked in Git &amp; Jira</text></g><g class="in" style="animation-delay:2.00s"><text class="sa" x="640" y="390" font-size="16" fill="#5EEAD4" font-weight="800">✔</text><text class="sa" x="664" y="390" font-size="16" fill="#E9E4FF">Clear updates, on-time delivery</text></g>
