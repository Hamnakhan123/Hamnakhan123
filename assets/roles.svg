<linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#FF6B1A"/><stop offset=".33" stop-color="#A78BFA"/><stop offset=".66" stop-color="#FCD34D"/><stop offset="1" stop-color="#FF6B1A"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="5s" repeatCount="indefinite"/></linearGradient>
